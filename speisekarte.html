<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<base href="../">
	<title>Speisekarte | Kastanie Moltzow</title>
	<meta name="description" content="Die aktuelle Speisekarte der Kastanie in Moltzow: Gerichte, Getränke und Preise auf einen Blick.">
	<link rel="canonical" href="https://www.bistro-kastanie.de/speisekarte">
	<meta name="theme-color" content="#DFCB97">
	<meta name="application-name" content="Kastanie Moltzow">
	<meta name="apple-mobile-web-app-title" content="Kastanie">
	<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
	<link rel="icon" type="image/png" sizes="32x32" href="bilder/icons/favicon-32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="bilder/icons/favicon-16.png">
	<link rel="icon" type="image/svg+xml" sizes="any" href="bilder/kastanie-logo.svg">
	<link rel="apple-touch-icon" sizes="180x180" href="bilder/icons/apple-touch-icon.png">
	<link rel="manifest" href="site.webmanifest">
	<meta property="og:type" content="website">
	<meta property="og:locale" content="de_DE">
	<meta property="og:site_name" content="Kastanie Moltzow">
	<meta property="og:title" content="Speisekarte | Kastanie Moltzow">
	<meta property="og:description" content="Die aktuelle Speisekarte der Kastanie in Moltzow: Gerichte, Getränke und Preise auf einen Blick.">
	<meta property="og:url" content="https://www.bistro-kastanie.de/speisekarte">
	<meta property="og:image" content="https://www.bistro-kastanie.de/bilder/icons/social-preview.png">
	<meta property="og:image:type" content="image/png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Logo der Kastanie Moltzow: grünes Kastanienblatt mit weißem K">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Speisekarte | Kastanie Moltzow">
	<meta name="twitter:description" content="Die aktuelle Speisekarte der Kastanie in Moltzow: Gerichte, Getränke und Preise auf einen Blick.">
	<meta name="twitter:image" content="https://www.bistro-kastanie.de/bilder/icons/social-preview.png">
	<meta name="twitter:image:alt" content="Logo der Kastanie Moltzow: grünes Kastanienblatt mit weißem K">

	<script>
		let initialMode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		try {
			const savedMode = localStorage.getItem('darkMode');
			if (savedMode === 'dark' || savedMode === 'light') initialMode = savedMode;
		} catch (error) {}
		document.documentElement.dataset.theme = initialMode;
		document.querySelector('meta[name="theme-color"]').content = initialMode === 'dark' ? '#2d2922' : '#DFCB97';
	</script>

	<link rel="stylesheet" href="speisekarte/styles.css?v=20260919-loader-theme" />
	<link rel="stylesheet" href="seasons/seasons.css?v=20260919-hidden-test" />

	<link href="vendor/fonts/fonts.css?v=20260921-local" rel="stylesheet">
</head>
<body>
	<div class="kastanie-background">
	<img src="bilder/Kastanie.svg" alt="Kastanie" />
	</div>

	<div id="loader">
		<div class="spinner"></div>
		<p>Speisekarte wird geladen…</p>
	</div>
	<div class="menu-container">
	<nav class="menu" id="menu"></nav>
	</div>
	<div class="container" id="content"></div>

	<!-- Menü-Template -->
	<script id="template-menu-item" type="text/template">
	<a href="{{link}}" target="_self" class="menu-item {{#if isLogo}}logo{{/if}}">
		<img src="{{image}}" alt="{{menutitel}}">
		{{#unless isLogo}}
		<div class="menu-title">{{menutitel}}</div>
		{{/unless}}
	</a>
	</script>

	<!-- Abschnitt-Template -->
	<script id="template-section" type="text/template">
		{{#if isLogo}}{{#if beschreibung}}
		<div class="logo-welcome-text">
			{{{nl2br beschreibung}}}
		</div>
		{{/if}}{{/if}}
		<div class="section-image" style="background-image: url('{{image}}');"></div>
		<div class="section-title">{{titel}}</div>
		<div class="section-content" id="{{link}}">
			<div class="gerichte-container">
				{{#each gerichte}}
				<div class="gericht">

					<div class="gericht-titel">{{titel}}</div>
					<p>{{{nl2br beschreibung}}}</p>
					{{#if zusatzstoffe}}
					<p class="zusatz">{{#if zusatzstoffetitel}}<strong>{{zusatzstoffetitel}}:</strong> {{/if}}{{zusatzstoffe}}</p>
					{{/if}}

					{{#if preisliste}}
					<div class="preis-liste">
						{{#each preisliste}}
						<div class="size">
							{{size}}
							<div class="preis">{{formatPreis preis}} €</div>
						</div>
						{{/each}}
					</div>
					{{/if}}

					{{#if preis}}
					<div class="preis">{{formatPreis preis}} €</div>
					{{/if}}

					{{#if beilagen}}
					<div class="beilagen">
					{{#if beilagentitel}}<div>{{beilagentitel}}</div>{{/if}}
					<ul class="beilage-liste">
						{{#each beilagen}}
						<li class="beilage-item">
						{{name}}{{#if preis}} +{{formatPreis preis}} €{{/if}}
						</li>
						{{/each}}
					</ul>
					</div>
					{{/if}}

					{{#if tag}}
					<div class="tag">{{tag}}</div>
					{{/if}}
				</div>
				{{/each}}
			</div>
			
		</div>
	</script>

	<script type="text/template" id="template-infotext">
		<div style="position: relative; margin-bottom: 50px; z-index: 100;">
			{{#if image}}
			<img src="{{image}}" alt="Infotext Bild" style="width: 100%; height: auto;" />
			{{/if}}
			<div class="gericht" style="{{#if image}}margin: -20% 10px 10px 10px; width: calc(100% - 20px);{{/if}}">
				{{{processInstagramText beschreibung}}}
			</div>
		</div>
	</script>

	<button class="dark-mode-toggle" id="darkModeToggle" aria-label="Dark Mode umschalten">
	<span class="sun-icon">☀️</span>
	<span class="moon-icon">🌙</span>
	</button>

	<div class="s-elements" data-season-page="speisekarte" aria-hidden="true"></div>

	<script src="vendor/handlebars/handlebars-4.7.8.min.js"></script>
	<script type="text/javascript" src="speisekarte/script.js?v=20260919-single-theme-init"></script>
	<script type="text/javascript" src="seasons/seasons.js?v=20260919-page-seasons"></script>

</body>
</html>
